name: Build and Publish BusControl PRO iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "ios/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/ios-release.yml"

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Read version
        id: version
        shell: bash
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION_NAME="${RAW_VERSION%%+*}"
          ORIGINAL_BUILD="${RAW_VERSION##*+}"
          BUILD_NUMBER="${{ github.run_number }}"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION_NAME}-${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --build-name "${{ steps.version.outputs.version_name }}" \
            --build-number "${{ steps.version.outputs.build_number }}"

      - name: Create IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry BusControl_PRO.ipa Payload
          rm -rf Payload

      - name: Read IPA metadata
        id: ipa
        shell: bash
        run: |
          SIZE=$(stat -f%z BusControl_PRO.ipa)
          SHA256=$(shasum -a 256 BusControl_PRO.ipa | awk '{print $1}')

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" build/ios/iphoneos/Runner.app/Info.plist)
          MIN_IOS=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" build/ios/iphoneos/Runner.app/Info.plist || echo "13.0")

          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "min_ios=$MIN_IOS" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            BusControl_PRO.ipa \
            --title "BusControl PRO ${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.build_number }})" \
            --notes "Automatic iOS build from commit ${{ github.sha }}" \
            --target main

      - name: Update SideStore source
        shell: python
        run: |
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          source_path = Path("sidestore/source.json")

          if source_path.exists():
              source = json.loads(source_path.read_text(encoding="utf-8"))
          else:
              source = {
                  "name": "BusControl PRO",
                  "subtitle": "Official BusControl PRO releases",
                  "description": "Official SideStore source for BusControl PRO.",
                  "apps": []
              }

          version = "${{ steps.version.outputs.version_name }}"
          build = "${{ steps.version.outputs.build_number }}"
          bundle_id = "${{ steps.ipa.outputs.bundle_id }}"
          size = int("${{ steps.ipa.outputs.size }}")
          sha256 = "${{ steps.ipa.outputs.sha256 }}"
          min_ios = "${{ steps.ipa.outputs.min_ios }}"
          tag = "${{ steps.version.outputs.tag }}"

          download_url = (
              "https://github.com/qwezionnn/buscontrol-pro/"
              f"releases/download/{tag}/BusControl_PRO.ipa"
          )

          new_version = {
              "version": version,
              "buildVersion": build,
              "marketingVersion": f"{version} ({build})",
              "date": datetime.now(timezone.utc).isoformat(),
              "localizedDescription": "Automatic BusControl PRO build.",
              "downloadURL": download_url,
              "size": size,
              "sha256": sha256,
              "minOSVersion": min_ios
          }

          apps = source.setdefault("apps", [])

          if apps:
              app = apps[0]
          else:
              app = {
                  "name": "BusControl PRO",
                  "bundleIdentifier": bundle_id,
                  "developerName": "BusControl PRO",
                  "subtitle": "Bus management and finance",
                  "localizedDescription": "BusControl PRO for iPhone.",
                  "category": "utilities",
                  "versions": []
              }
              apps.append(app)

          app["bundleIdentifier"] = bundle_id

          versions = app.setdefault("versions", [])

          versions = [
              v for v in versions
              if not (
                  v.get("version") == version
                  and v.get("buildVersion") == build
              )
          ]

          versions.insert(0, new_version)
          app["versions"] = versions

          source_path.parent.mkdir(parents=True, exist_ok=True)
          source_path.write_text(
              json.dumps(source, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

      - name: Commit updated SideStore source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sidestore/source.json

          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "Update SideStore source"
            git push origin HEAD:main
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusControl-PRO-iOS
          path: BusControl_PRO.ipa